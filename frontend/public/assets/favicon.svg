<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#C850C0"/>
      <stop offset="50%"  stop-color="#4158D0"/>
      <stop offset="100%" stop-color="#00C9FF"/>
    </linearGradient>
  </defs>

  <!-- Cubo hexagonal (outline) -->
  <!-- Face frontal baixo -->
  <polygon points="32,56 10,44 10,24 32,12 54,24 54,44"
    fill="none" stroke="url(#g1)" stroke-width="3.5"
    stroke-linejoin="round"/>

  <!-- Linha central vertical (divisória) -->
  <line x1="32" y1="12" x2="32" y2="56"
    stroke="url(#g1)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Linhas do topo do cubo formando o M/V da logo -->
  <!-- V esquerdo -->
  <polyline points="10,24 21,30 32,24"
    fill="none" stroke="url(#g1)" stroke-width="3.5"
    stroke-linejoin="round" stroke-linecap="round"/>
  <!-- V direito -->
  <polyline points="32,24 43,30 54,24"
    fill="none" stroke="url(#g1)" stroke-width="3.5"
    stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Arco superior (topo aberto do cubo/caixa) -->
  <polyline points="16,20 32,10 48,20"
    fill="none" stroke="url(#g1)" stroke-width="3.5"
    stroke-linejoin="round" stroke-linecap="round"/>
</svg>
