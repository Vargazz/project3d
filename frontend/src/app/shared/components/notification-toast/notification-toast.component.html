<div class="fixed bottom-4 right-4 z-[100] flex flex-col gap-2 max-w-sm w-full pointer-events-none">
  <div *ngFor="let toast of toasts$ | async"
    class="pointer-events-auto flex items-start gap-3 bg-white rounded-xl shadow-lg border border-gray-100 p-3.5 animate-slide-in">
    <div [class]="'w-7 h-7 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0 ' + bgClass(toast.type)">
      {{icon(toast.type)}}
    </div>
    <p class="text-sm text-dark-800 flex-1 pt-0.5">{{toast.message}}</p>
    <button (click)="remove(toast.id)" class="text-gray-400 hover:text-gray-600 shrink-0 pt-0.5">✕</button>
  </div>
</div>
