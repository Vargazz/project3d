<app-header></app-header>
<main class="min-h-screen flex items-center justify-center py-16 px-4" style="background: var(--bg)">
  <div class="card p-10 max-w-lg w-full text-center">
    <div class="text-6xl mb-4">{{ config.icon }}</div>
    <h1 class="text-2xl font-black mb-2" [class]="config.color">{{ config.title }}</h1>
    <p class="text-gray-600 mb-6">{{ config.message }}</p>
    <p *ngIf="orderId" class="text-xs text-gray-400 mb-6">Pedido: #{{ orderId }}</p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a [routerLink]="config.btnRoute" class="btn-primary">{{ config.btnLabel }}</a>
      <a routerLink="/produtos" class="btn-secondary">Continuar comprando</a>
    </div>
  </div>
</main>
<app-footer></app-footer>
