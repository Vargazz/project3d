<div>
  <h1 class="text-2xl font-black text-dark-900 mb-6">Clientes</h1>
  <div class="card overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 border-b border-gray-100"><tr>
        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500">Nome</th>
        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500">E-mail</th>
        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500">Cadastro</th>
        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500">Status</th>
        <th class="px-4 py-3"></th>
      </tr></thead>
      <tbody>
        <tr *ngIf="loading"><td colspan="5" class="text-center py-8 text-gray-400">Carregando...</td></tr>
        <tr *ngFor="let c of customers" class="border-b border-gray-50 hover:bg-gray-50">
          <td class="px-4 py-3 font-medium text-dark-900">{{ c.fullName }}</td>
          <td class="px-4 py-3 text-gray-600">{{ c.email }}</td>
          <td class="px-4 py-3 text-gray-500">{{ c.createdAt | date:'dd/MM/yyyy' }}</td>
          <td class="px-4 py-3"><span class="badge" [class.badge-green]="c.isActive" [class.badge-red]="!c.isActive">{{ c.isActive ? 'Ativo' : 'Bloqueado' }}</span></td>
          <td class="px-4 py-3"><button (click)="toggle(c)" class="btn-secondary btn-sm">{{ c.isActive ? 'Bloquear' : 'Ativar' }}</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
