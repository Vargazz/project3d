<div class="min-h-screen flex" style="background:#0f0f1a;">

  <!-- ── Sidebar ── -->
  <aside
    [class.w-56]="sidebarOpen"
    [class.w-14]="!sidebarOpen"
    class="flex flex-col flex-shrink-0 transition-all duration-200"
    style="background:#1a1a2e; border-right:1px solid #2d2d44;">

    <!-- Logo VM3D -->
    <div class="flex items-center gap-2.5 px-3 py-4" style="border-bottom:1px solid #2d2d44; min-height:64px;">
      <!-- Cubo SVG VM3D -->
      <svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="flex-shrink-0">
        <defs>
          <linearGradient id="admingrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#C850C0"/>
            <stop offset="50%"  stop-color="#4158D0"/>
            <stop offset="100%" stop-color="#00C9FF"/>
          </linearGradient>
        </defs>
        <polygon points="20,4 35,12 35,28 20,36 5,28 5,12"
          fill="none" stroke="url(#admingrad)" stroke-width="2.5" stroke-linejoin="round"/>
        <line x1="20" y1="4" x2="20" y2="36"
          stroke="url(#admingrad)" stroke-width="2" stroke-linecap="round"/>
        <polyline points="5,12 12.5,18 20,12"
          fill="none" stroke="url(#admingrad)" stroke-width="2.5"
          stroke-linejoin="round" stroke-linecap="round"/>
        <polyline points="20,12 27.5,18 35,12"
          fill="none" stroke="url(#admingrad)" stroke-width="2.5"
          stroke-linejoin="round" stroke-linecap="round"/>
        <polyline points="10,8 20,3 30,8"
          fill="none" stroke="url(#admingrad)" stroke-width="2.5"
          stroke-linejoin="round" stroke-linecap="round"/>
      </svg>

      <div *ngIf="sidebarOpen" class="overflow-hidden leading-none">
        <span class="font-black text-base block"
          style="background:linear-gradient(90deg,#C850C0,#00C9FF); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;">
          VM3D
        </span>
        <span class="text-[9px] font-semibold uppercase tracking-widest" style="color:#64748b;">
          Admin Panel
        </span>
      </div>
    </div>

    <!-- Nav -->
    <nav class="flex-1 py-2 overflow-y-auto">
      <a *ngFor="let item of navItems"
        [routerLink]="item.route"
        routerLinkActive="sidebar-active"
        class="sidebar-link"
        [title]="item.label">
        <span class="text-lg flex-shrink-0">{{ item.icon }}</span>
        <span *ngIf="sidebarOpen" class="text-sm font-medium truncate">{{ item.label }}</span>
      </a>
    </nav>

    <!-- Footer da sidebar -->
    <div class="p-3" style="border-top:1px solid #2d2d44;">
      <!-- Info do admin (quando expandido) -->
      <div *ngIf="sidebarOpen" class="flex items-center gap-2 mb-2 px-1">
        <div class="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0 text-white text-xs font-bold"
          style="background:linear-gradient(135deg,#9B59B6,#00BCD4);">
          {{ auth.currentUser?.fullName?.[0] }}
        </div>
        <div class="min-w-0">
          <p class="text-xs font-semibold text-white truncate">{{ auth.currentUser?.fullName }}</p>
          <p class="text-[10px]" style="color:#64748b;">Administrador</p>
        </div>
      </div>

      <div class="flex gap-1">
        <!-- Toggle sidebar -->
        <button (click)="sidebarOpen = !sidebarOpen"
          class="sidebar-icon-btn flex-1"
          [title]="sidebarOpen ? 'Recolher' : 'Expandir'">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              [attr.d]="sidebarOpen ? 'M11 19l-7-7 7-7' : 'M13 5l7 7-7 7'"/>
          </svg>
        </button>
        <!-- Ver loja -->
        <a routerLink="/" class="sidebar-icon-btn flex-1" title="Ver loja">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
          </svg>
        </a>
        <!-- Logout -->
        <button (click)="auth.logout()" class="sidebar-icon-btn flex-1 text-red-400" title="Sair">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ── Conteúdo principal ── -->
  <div class="flex-1 min-w-0 flex flex-col overflow-hidden">

    <!-- Topbar -->
    <header class="flex items-center justify-between px-6 py-3 flex-shrink-0"
      style="background:#1a1a2e; border-bottom:1px solid #2d2d44; min-height:56px;">
      <div class="flex items-center gap-3">
        <button (click)="sidebarOpen = !sidebarOpen"
          class="p-1.5 rounded-lg transition-colors md:hidden"
          style="color:#94a3b8;">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        <h1 class="text-sm font-semibold" style="color:#e2e8f0;">Painel Administrativo</h1>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs px-2 py-1 rounded-full font-semibold"
          style="background:rgba(155,89,182,0.2); color:#C850C0;">
          Admin
        </span>
        <span class="text-xs" style="color:#64748b;">{{ auth.currentUser?.email }}</span>
      </div>
    </header>

    <!-- Área de conteúdo -->
    <main class="flex-1 overflow-auto p-6" style="background:#f4f4f8;">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
