# ──────────────────────────────────────────────────────────────────────────────
# Compose para DESENVOLVIMENTO LOCAL
# Sobe apenas o banco. Backend e frontend rodam localmente na sua máquina.
#
# Uso:
#   docker compose -f docker-compose.dev.yml up -d
#
# Depois rode:
#   cd backend/src/Project3D.API && dotnet run
#   cd frontend && ng serve
# ──────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: project3d_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       project3d
      POSTGRES_USER:     project3d_user
      POSTGRES_PASSWORD: project3d_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U project3d_user -d project3d']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: project3d_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vm3d.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
